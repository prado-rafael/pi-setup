name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm run check
      - name: Install the pinned test runtime
        run: |
          version="$(node -p "require('./versions.json').pi")"
          npm install --prefix "$RUNNER_TEMP/pi-runtime" --ignore-scripts --omit=dev --no-audit --no-fund --no-package-lock "@earendil-works/pi-coding-agent@$version"
      - run: npm test
        env:
          PI_TEST_RUNTIME: ${{ runner.temp }}/pi-runtime
      - run: bash -n install.sh
